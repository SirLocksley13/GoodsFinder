name: Finalize Goods Finder v1.1.1

on:
  push:
    branches:
      - candidate/v1.1.1-controls
    paths:
      - '.github/workflows/finalize-v1.1.1.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: candidate/v1.1.1-controls

      - name: Build clean final package
        run: |
          mkdir -p release
          rm -f release/GoodsFinder_v*.zip
          zip -r release/GoodsFinder_v1.1.1.zip goods-finder

      - name: Refresh checksums
        run: |
          : > CHECKSUMS.txt
          sha256sum release/GoodsFinder_v1.1.1.zip | awk '{print "SHA256  "$1"  "$2}' >> CHECKSUMS.txt
          md5sum release/GoodsFinder_v1.1.1.zip | awk '{print "MD5     "$1"  "$2}' >> CHECKSUMS.txt
          sha256sum media/GoodsFinder_Modio_Logo_1280x720.png | awk '{print "SHA256  "$1"  "$2}' >> CHECKSUMS.txt
          md5sum media/GoodsFinder_Modio_Logo_1280x720.png | awk '{print "MD5     "$1"  "$2}' >> CHECKSUMS.txt
          sha256sum media/GoodsFinder_How_To_Use_1280x720.png | awk '{print "SHA256  "$1"  "$2}' >> CHECKSUMS.txt
          md5sum media/GoodsFinder_How_To_Use_1280x720.png | awk '{print "MD5     "$1"  "$2}' >> CHECKSUMS.txt

      - name: Commit final package and checksums
        run: |
          git config user.name "SirLocksley13"
          git config user.email "actions@users.noreply.github.com"
          git add -A release CHECKSUMS.txt
          git commit -m "Finalize Goods Finder v1.1.1 release package"
          git push origin HEAD:candidate/v1.1.1-controls

      - name: Upload exact final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GoodsFinder_v1.1.1
          path: release/GoodsFinder_v1.1.1.zip
          if-no-files-found: error
          retention-days: 7
