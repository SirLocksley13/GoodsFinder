name: Package Goods Finder v1.1.1 Candidate 2

on:
  push:
    branches:
      - candidate/v1.1.1-controls
    paths:
      - '.github/workflows/package-v1.1.1-candidate2.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Create complete mod ZIP
        run: zip -r GoodsFinder_v1.1.1_Controls_Candidate2.zip goods-finder

      - name: Upload complete mod ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GoodsFinder_v1.1.1_Controls_Candidate2
          path: GoodsFinder_v1.1.1_Controls_Candidate2.zip
          if-no-files-found: error
          retention-days: 7
